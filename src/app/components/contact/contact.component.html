<div class="container">

  <div class="section-title">
    <h2>Contato</h2>
    <p>Contate-me</p>
  </div>

  <div class="row mt-2">

    <div class="col-md-6 d-flex align-items-stretch">
      <div class="info-box">
        <i class="bi bi-share icon"></i>
        <h3>Perfis online</h3>
        <div class="social-links">
          @for (item of socialMedias; track $index) {
            <a href={{item.link}} class={{item.id}}><i class={{item.class}}></i></a>
          }
        </div>
      </div>
    </div>

    <div class="col-md-6 mt-4 mt-md-0 d-flex align-items-stretch">
      <div class="info-box">
        <i class="bi bi-envelope-at icon"></i>
        <h3>E-mail</h3>
        <p>{{user.email}}</p>
      </div>
    </div>

    <div class="col-md-6 mt-4 d-flex align-items-stretch">
      <div class="info-box">
        <i class="bi bi-telephone-forward icon"></i>
        <h3>Telefone</h3>
        <p>{{user.number}}</p>
      </div>
    </div>

  </div>
